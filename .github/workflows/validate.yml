name: Validate CQE Sentinel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.evaluate --check
      - name: Replay HTTP success and failure through Uvicorn
        shell: bash
        run: |
          PORT=8001 SENTINEL_DB_PATH=:memory: DEMO_MODE=1 python app.py > /tmp/sentinel-ci.log 2>&1 &
          sentinel_pid=$!
          trap 'kill "$sentinel_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8001/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8001/healthz > /dev/null || { cat /tmp/sentinel-ci.log; exit 1; }
          python -m benchmarks.smoke_http
